<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elastyczne nawyki</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2e7d5b">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Nawyki">
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1f2a24;--mut:#6b7770;--ac:#2e7d5b;--ac2:#e8f3ed;--bd:#e3e0d8;--warn:#e07a1f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1b241f;--tx:#e9efeb;--mut:#92a199;--ac:#4cc38a;--ac2:#1f3329;--bd:#2a3730;--warn:#f0954a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121815;--card:#1b241f;--tx:#e9efeb;--mut:#92a199;--ac:#4cc38a;--ac2:#1f3329;--bd:#2a3730;--warn:#f0954a;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4}
main{max-width:600px;margin:0 auto;padding:16px 14px 60px}
h1{font-size:21px;margin:0}.sub{color:var(--mut);font-size:13px;margin:2px 0 12px}
h3{font-size:14px;margin:14px 0 4px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.tabs{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.tabs button{flex:1;padding:9px 6px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.hero{display:flex;align-items:center;gap:14px}
.ring{position:relative;width:88px;height:88px;flex:none}.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px}
.msg{font-weight:600}.q{color:var(--mut);font-size:13px;margin-top:4px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.chip{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 4px;text-align:center;font-size:12px;color:var(--mut)}
.chip b{display:block;font-size:15px;color:var(--tx)}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--bd)}.row:last-child{border:0}
.nm{flex:1;font-size:14px}.nm small{display:block;color:var(--mut);font-size:12px}
.lv{min-width:62px;padding:7px 8px;border-radius:9px;border:1px solid var(--bd);background:transparent;color:var(--mut);font-size:13px;cursor:pointer}
.lv.l1{background:var(--ac2);color:var(--tx);border-color:var(--ac)}
.lv.l2{background:var(--ac);color:#fff;border-color:var(--ac);opacity:.85}
.lv.l3{background:var(--warn);color:#fff;border-color:var(--warn)}
button.pri{padding:10px 14px;border-radius:10px;border:0;background:var(--ac);color:#fff;font-weight:600;cursor:pointer;font-size:14px}
button.sec{padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:transparent;color:var(--tx);cursor:pointer;font-size:14px}
.big{font-size:44px;font-weight:700;text-align:center;margin:6px 0}
.ex{font-size:18px;font-weight:600;text-align:center}.var{text-align:center;color:var(--mut);margin:4px 0 10px}
.btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.bar{height:6px;background:var(--ac2);border-radius:9px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--ac)}
.tl{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid var(--bd)}.tl:last-child{border:0}
.tl b{min-width:78px;font-size:13px;color:var(--ac)}.tl span{font-size:14px}.tl small{display:block;color:var(--mut);font-size:12px}
.week{display:flex;gap:6px}.day{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.dot{aspect-ratio:1;max-width:38px;margin:4px auto 0;border-radius:50%;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-size:12px}
.dot.f{background:var(--ac);border-color:var(--ac);color:#fff}.dot.p{background:var(--ac2);border-color:var(--ac)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px;text-align:center}.st b{display:block;font-size:20px}.st span{font-size:12px;color:var(--mut)}
.ck{width:30px;height:30px;border-radius:50%;border:2px solid var(--bd);background:transparent;color:#fff;cursor:pointer;flex:none}.ck.on{background:var(--ac);border-color:var(--ac)}
.note{font-size:12px;color:var(--mut)}.foot{text-align:center;margin-top:10px}.foot button{background:none;border:0;color:var(--mut);text-decoration:underline;font-size:12px;cursor:pointer}
</style>
</head>
<body>
<main>
<h1 id="gr">Elastyczne nawyki</h1><div class="sub" id="dt"></div>
<div class="tabs" id="tabs"></div>
<div id="v"></div>
</main>
<script>
(function(){
var KEY="nawyki-v2";
var CATS={z:["Zdrowie","💪"],m:["Umysł","🧠"],r:["Relacje","🤝"],d:["Duch","🕊️"]};
var LV=["—","Mini","Plus","Elita"];
var H=[
["w1","z","Szklanka wody rano / białko","rano"],["w2","z","Ćwiczenia fizyczne (ruch)","okno treningowe"],["w3","z","Spacer (kroki)","w ciągu dnia"],
["w4","z","Prysznic zimny / kontrastowy","rano"],["w5","z","Reset wzroku (patrzenie w dal)","co 45 min w pracy"],["w6","z","Zielona herbata","przedpołudnie"],
["w7","z","Owoc i warzywo","do posiłków"],["w8","z","Wypicie 2 litrów wody","do 16:00"],["w9","z","Różne sposoby siedzenia",""],["w10","z","Leżenie na podłodze 5 min","po ćwiczeniach"],
["m1","m","Słuchanie audiobooka","w drodze / spacer"],["m2","m","Czytanie książki / nauka hiszpańskiego","wieczorem"],["m3","m","Angielski (audiobook / słownictwo)","w ciągu dnia"],
["m4","m","Planowanie kolejnego dnia i podsumowanie","przed snem"],["m5","m","Czytanie na głos 5 min",""],["m6","m","Pisanie bezwzrokowe 5 min",""],
["r1","r","Pochwała / wdzięczność / coś dla innych","codziennie"],["r2","r","Telefon do bliskiej osoby / spotkanie","popołudnie"],
["d1","d","Tekst dzienny na głos","rano lub wieczorem"],["d2","d","Czytanie Biblii","wieczorem / rano"],["d3","d","Przygotowanie się do zebrania","popołudniu"],["d4","d","Studium osobiste","w ciągu dnia"]
];
var SIT=[["Krążenie głową i rozciąganie szyi","Siedząc prosto na krześle","Siad skrzyżny / klęk"],["Mobilizacja nadgarstków i przedramion","Siedząc przy biurku","W klęku, docisk dłoni do maty"],
["Przyciąganie kolana do klatki + ruch stopy","Siedząc na krześle","Leżenie na plecach"],["Przyciąganie kolana i wyprost nogi","Siedząc na krześle","Leżenie na plecach lub siedząc"],
["„Czwórka” (stopa na kolano + skłon)","Siedząc na krześle","Leżenie, chwyt pod udem"],["Przekładanie kolan z boku na bok 90/90","Siedząc na brzegu krzesła","Leżenie tyłem, ręce w bok"],
["Wypchnięcie bioder (mostek)","Spięcie pośladków w siadzie","Most biodrowy w leżeniu"],["Mostek jednonóż / spięcie pośladka","Pięta na kolano w siadzie","Wypychanie bioder, pięta na kolanie"],
["Unoszenie nogi w bok","W siadzie na krześle","Podpora bokiem / leżenie na boku"],["Stół (odwrócony podpór)","Dłonie na blacie biurka","Odwrócony podpór w siadzie na ziemi"],
["Stół na jednej ręce z rotacją tułowia","Oparcie o blat biurka","W siadzie na ziemi"],["Koci grzbiet","Dłonie na blacie biurka","Klęk podparty"],
["Odchylanie ręki do tyłu z rotacją","Siedząc na krześle","W klęku podpartym"],["Ukłon japoński (pozycja dziecka)","Skłon do ud, ręce na blacie","Siad na piętach, czoło do maty"],
["Pies z głową w dół i w górę","Stojąc z oparciem o biurko","Podpór przodem / klęk"]];
var STD=["Pies z głową w dół (dłonie na blacie)","Szybkie oddychanie przeponowe","Krążenie głową i na boki","Machanie rękami (koła i nożyce)","Przeciąganie rąk do góry",
"Odchylanie ręki do tyłu z rotacją klatki","Skłon boczny (ręka na głowę, druga do kolana)","Krążenie biodrami","Kossak (przypad w rozkroku)","Przyciąganie kolana do klatki + ruch stopy",
"Przyciąganie kolana i wyprost nogi","Krążenie stopami na jednej nodze","Pchanie kolana nad palce (Achilles)","Stawanie na palcach","Wykrok i przyklęk","Przysiad i ugięcie kolan",
"Przysiad ze skłonem tułowia","Skłony o prostych plecach","Jaskółka","Deska przy ścianie / blacie biurka","Pajacyki / podskoki w miejscu"];
var RY=[["06:00","Wypij 1–2 szklanki wody przed kawą i telefonem","Rozcieńcza krew po nocy, pobudza jelita"],["06:15","10 minut spaceru / poranne światło","Synchronizuje zegar biologiczny"],
["07:00","Śniadanie bogate w białko i tłuszcze, kawa dopiero po","Stabilizuje glukozę i energię"],["07:00–15:00","Co 30–45 min: 90 s resetu (oddechy, wzrok)","Chroni plecy, rozluźnia oczy"],
["12:30","Spacer po posiłku, ok. 10 min","Zapobiega senności"],["15:00","Dekompresja: 5 min płasko na twardej podłodze, nogi ugięte","Odciąża krążki międzykręgowe"],
["15:00–17:00","Okno treningowe: ruch / nauka / uważność","Najniższe ryzyko kontuzji"],["16:00","Zakończ picie większości płynów (ok. 70% dziennej wody)","Głębszy sen"],
["do 19:00","Lekka kolacja o stałej porze","Odciąża układ pokarmowy"],["20:30","Ekrany off na 90 minut przed snem","Więcej melatoniny"],
["przed snem","Nitkowanie zębów, płukanie gardła 30 s, nucenie 60 s","Wycisza układ nerwowy"]];
var QU=["Małe kroki robione codziennie wygrywają z wielkimi zrywami.","Mini też się liczy. Ważne, żeby nie było zera.","Konsekwencja jest cichszą, ale silniejszą wersją motywacji.","Zacznij od poziomu Mini, a Plus i Elita przyjdą same.","Jeden dzień to niewiele. Setka takich dni zmienia życie."];
var S={l:{},ro:{},dra:{}};
try{var r=localStorage.getItem(KEY);if(r){var p=JSON.parse(r);if(p&&p.l)S=p;}}catch(e){}
function sv(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function pad(n){return n<10?"0"+n:""+n}
function key(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function ago(n){var d=new Date();d.setDate(d.getDate()-n);return d}
function $(i){return document.getElementById(i)}
function cats(k){var m={z:0,m:0,r:0,d:0},l=S.l[k]||{};H.forEach(function(h){var v=l[h[0]]||0;if(v>m[h[1]])m[h[1]]=v});return m}
function pts(k){var m=cats(k);return m.z+m.m+m.r+m.d}
function stat(p){return p>=8?"Mistrzostwo! 🏆":p>=4?"Super! ⭐":p>=1?"Dobry dzień! 👍":"Do dzieła! 🌱"}
function mdays(){var n=new Date(),a=[];for(var d=1;d<=n.getDate();d++)a.push(key(new Date(n.getFullYear(),n.getMonth(),d)));return a}
function streak(){var n=pts(key(ago(0)))>0?0:1,c=0;while(pts(key(ago(n)))>0&&c<400){c++;n++}return c}
var tab="dzis",P=null,timer=null;
var TABS=[["dzis","Dziś"],["roz","Rozruch"],["ryt","Rytm dnia"],["post","Postęp"]];

function setLv(id){var k=key(new Date());S.l[k]=S.l[k]||{};S.l[k][id]=((S.l[k][id]||0)+1)%4;sv();render()}
function dzis(){
 var k=key(new Date()),l=S.l[k]||{},c=cats(k),p=pts(k),h="";
 h+='<div class="card hero"><div class="ring"><svg width="88" height="88" viewBox="0 0 88 88"><circle cx="44" cy="44" r="37" fill="none" stroke="var(--ac2)" stroke-width="9"/><circle cx="44" cy="44" r="37" fill="none" stroke="var(--ac)" stroke-width="9" stroke-linecap="round" stroke-dasharray="232.5" stroke-dashoffset="'+(232.5*(1-p/12))+'"/></svg><b>'+p+'/12</b></div><div><div class="msg">'+stat(p)+'</div><div class="q">„'+QU[Math.floor(Date.now()/864e5)%QU.length]+'”</div></div></div>';
 h+='<div class="chips">';for(var i in CATS)h+='<div class="chip">'+CATS[i][1]+'<b>'+LV[c[i]]+'</b>'+CATS[i][0]+'</div>';h+='</div>';
 for(var i in CATS){h+='<div class="card"><h3 style="margin-top:0">'+CATS[i][1]+' '+CATS[i][0]+'</h3>';
  H.forEach(function(x){if(x[1]!==i)return;var v=l[x[0]]||0;h+='<div class="row"><div class="nm">'+x[2]+(x[3]?'<small>'+x[3]+'</small>':'')+'</div><button class="lv l'+v+'" data-a="lv" data-id="'+x[0]+'">'+LV[v]+'</button></div>'});h+='</div>'}
 return h+'<div class="note">Dotknij nawyku, aby zmienić poziom: Mini (1 pkt) → Plus (2) → Elita (3). W każdej kategorii liczy się Twój najwyższy poziom z dnia, razem maksymalnie 12 punktów.</div>';
}
function roz(){
 var k=key(new Date()),ro=S.ro[k]||{},h="";
 if(P){var L=P.m==="s"?SIT:STD,e=L[P.i],a=P.m==="s"?e[1]:"W wolnej przestrzeni",b=P.m==="s"?e[2]:"Przy krześle, dłoń na oparciu",n=P.m==="s"?e[0]:e;
  h+='<div class="card"><div class="note" style="text-align:center">Ćwiczenie '+(P.i+1)+' z '+L.length+'</div><div class="bar"><i style="width:'+(P.i/L.length*100)+'%"></i></div><div class="ex">'+n+'</div><div class="var">'+(P.v==="A"?(P.m==="s"?"Biuro: ":"Stanie: ")+a:(P.m==="s"?"Mata: ":"Krzesło: ")+b)+'</div><div class="big" id="tm">'+P.t+' s</div><div class="btns"><button class="sec" data-a="var">Wariant '+(P.v==="A"?"B":"A")+'</button><button class="pri" data-a="run">'+(P.run?"Pauza":"Start")+'</button><button class="sec" data-a="nx">Dalej ›</button></div><div class="foot"><button data-a="stop">Przerwij</button></div></div>';}
 else{h+='<div class="g2"><div class="card"><b>Siedząca</b><div class="note">15 ćwiczeń, ok. 8 min</div><p>'+(ro.s?"✅ Zrobione":"Do zrobienia")+'</p><button class="pri" data-a="go" data-m="s">Start</button></div><div class="card"><b>Stojąca</b><div class="note">21 ćwiczeń, ok. 11 min</div><p>'+(ro.t?"✅ Zrobione":"Do zrobienia")+'</p><button class="pri" data-a="go" data-m="t">Start</button></div></div><div class="note">Każde ćwiczenie to 30 sekund z timerem. Jedna faza podnosi „Ćwiczenia fizyczne” do Plus, obie do Elita.</div>';}
 return h;
}
function ryt(){var h='<div class="card">';RY.forEach(function(x){h+='<div class="tl"><b>'+x[0]+'</b><span>'+x[1]+'<small>'+x[2]+'</small></span></div>'});return h+'</div>'}
function post(){
 var D=mdays(),tp=0,act=0,el=0;D.forEach(function(k){var p=pts(k);tp+=p;if(p>0)act++;var c=cats(k);for(var i in c)if(c[i]===3)el++});
 var h='<div class="g2"><div class="st"><b>'+tp+'</b><span>punkty w miesiącu</span></div><div class="st"><b>'+Math.round(act/D.length*100)+'%</b><span>dni z minimum Mini</span></div><div class="st"><b>'+el+'</b><span>poziomów Elita</span></div><div class="st"><b>'+streak()+'</b><span>dni z rzędu</span></div></div>';
 var nm=["pn","wt","śr","cz","pt","sb","nd"];h+='<h3>Ostatnie 7 dni</h3><div class="card"><div class="week">';
 for(var i=6;i>=0;i--){var d=ago(i),p=pts(key(d));h+='<div class="day">'+nm[(d.getDay()+6)%7]+'<div class="dot '+(p>=8?"f":p>0?"p":"")+'">'+p+'</div></div>'}
 h+='</div></div><h3>Tygodnie miesiąca</h3><div class="card">';
 var n2=new Date(),A2=[],last=new Date(n2.getFullYear(),n2.getMonth()+1,0).getDate();for(var q=1;q<=last;q++)A2.push(key(new Date(n2.getFullYear(),n2.getMonth(),q)));
 for(var w=0;w<4;w++){var s=0,from=w*7,to=w===3?last:from+7;A2.slice(from,to).forEach(function(k){s+=pts(k)});h+='<div class="row"><div class="nm">Tydzień '+(w+1)+'<small>dni '+(from+1)+'–'+to+'</small></div><b>'+s+' pkt</b></div>'}
 h+='</div><div class="foot"><button data-a="reset">Wyczyść postępy</button></div>';
 return h;
}
function render(){
 var n=new Date(),hr=n.getHours();$("gr").textContent=hr<12?"Dzień dobry!":hr<18?"Miłego dnia!":"Dobry wieczór!";
 $("dt").textContent=n.toLocaleDateString("pl-PL",{weekday:"long",day:"numeric",month:"long"})+" · streak: "+streak();
 $("tabs").innerHTML=TABS.map(function(t){return '<button class="'+(tab===t[0]?"on":"")+'" data-a="tab" data-id="'+t[0]+'">'+t[1]+'</button>'}).join("");
 $("v").innerHTML=tab==="dzis"?dzis():tab==="roz"?roz():tab==="ryt"?ryt():post();
}
function tick(){if(!P||!P.run)return;P.t--;if(P.t<=0){P.t=0;P.run=false;try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}render();return}var t=$("tm");if(t)t.textContent=P.t+" s"}
function fin(){var k=key(new Date());S.ro[k]=S.ro[k]||{};S.ro[k][P.m]=1;var n=(S.ro[k].s?1:0)+(S.ro[k].t?1:0);S.l[k]=S.l[k]||{};S.l[k].w2=Math.max(S.l[k].w2||0,n>1?3:2);sv();P=null;render()}
document.addEventListener("click",function(ev){
 var t=ev.target.closest("[data-a]");if(!t)return;var a=t.getAttribute("data-a"),id=t.getAttribute("data-id");
 if(a==="tab"){tab=id;render()}
 else if(a==="lv")setLv(id);
 else if(a==="go"){P={m:t.getAttribute("data-m"),i:0,t:30,run:false,v:"A"};render()}
 else if(a==="run"){P.run=!P.run;if(P.t<=0)P.t=30;render()}
 else if(a==="var"){P.v=P.v==="A"?"B":"A";render()}
 else if(a==="nx"){var L=P.m==="s"?SIT:STD;P.i++;if(P.i>=L.length){fin();return}P.t=30;render()}
 else if(a==="stop"){P=null;render()}
 else if(a==="reset"){if(confirm("Na pewno wyczyścić wszystkie postępy?")){S={l:{},ro:{},dra:{}};sv();render()}}
});
setInterval(tick,1000);render();
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")}catch(e){}
})();
</script>
</body>
</html>
